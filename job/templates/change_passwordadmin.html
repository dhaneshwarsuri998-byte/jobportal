{%load static %}

{% block body %}
    {% include 'admin_navigation.html' %}

    <script>
    function checkpass()
    {
        if (document.changepassword.newpassword.value!==document.changepassword.confirmpassword.value)
        {
            alert('New Password and Confirm Password does not match ');
            document.changepassword.confirmpassword.focus();
            return false;
        }
        return true;
    }

    </script>

<marquee style="font-family: 'Monotype Corsiva',serif ; font-size: 25px ; color: darkcyan ; background-color: black ; font-weight: bold ; margin-top: 1% ">
    Change Password
    </marquee>
    <hr>
    <form class="container mt-5" method="post" name="changepassword" onsubmit="return checkpass()">
     {% csrf_token %}
     <label>Current Password</label>
        <label>
            <input type="password" class="form-control" name="currentpassword" required>
        </label>
        <br>

        <label>New Password</label>
        <label>
            <input type="password" class="form-control" name="newpassword" required>
        </label>
        <br>

        <label>Confirm New Password</label>
        <label>
            <input type="password" class="form-control" name="confirmpassword" required>
        </label>

        <br>
        <br>
    <label>
            <input type="submit" class="btn btn-primary" style="margin-left: 2% ; color: darkcyan ; background-color: black ; height: 40px ">
        </label>


    </form>

        {% if error == "no" %}
    <script>
    alert("Password changed successfully");
    window.location.href = ('{% url 'Logout' %}')
    </script>
    {% endif %}

    {% if error == "yes" %}
    <script>
    alert("Something went wrong");
    </script>
    {% endif %}

    {% if error == "not" %}
    <script>
    alert("Current Password is wrong");
    </script>
    {% endif %}

{% endblock %}
