{%load static %}

{% block body %}
    {% include 'recruiter_navigation.html' %}

    <marquee style="font-family: 'Monotype Corsiva',serif ; font-size: 25px ; color: darkcyan ; background-color: black ; font-weight: bold ; margin-top: 1% ">
    Edit Job Details
    </marquee>
<hr>


    <form class="container mt-5" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-12">
<label>Job Title</label>
            <label>
                <input type="text" class="form-control" name="title" value="{{ job.title }}" required>
            </label>
        </div>

<div class="form-group col-md-6">
<label>Salary(Per Month)</label>
    <label>
        <input type="text" class="form-control" name="salary" value="{{ job.salary }}" required>
    </label>
</div>

<div class="form-group col-md-6">
<label>Location</label>
    <label>
        <input type="text" class="form-control" name="location" value="{{ job.location }}" required>
    </label>
</div>

<div class="form-group col-md-6">
<label>Skills Required</label>
    <label>
        <input type="text" class="form-control" name="skills" value="{{ job.skills }}" required>
    </label>
</div>

<div class="form-group col-md-6">
<label>Experience(in Years)</label>
    <label>
        <input type="text" class="form-control" name="experience" value="{{ job.experience}}" required>
    </label>
</div>

<div class="form-group col-md-6">
    <label>Start Date</label><span style="color: red">[{{ job.start_date}}]</span>
    <label>
        <input type="date" class="form-control" name="start_date"  >
    </label>
</div>

<div class="form-group col-md-6">
<label>End Date</label><span style="color: red">[{{ job.end_date }}]</span>
    <label>
        <input type="date" class="form-control" name="end_date" >
    </label>
</div>

<div class="form-group col-md-6">
<label>Description</label>
    <label>
        <textarea class="form-control" name="description" >{{ job.description }}</textarea>
    </label>
</div>

<br>

<input type="submit" value="Add Job" class="btn btn-primary my-3">
    </div>


    </form>
    <br>
    <br>
    <br>


{% include 'footer.html' %}

{% if error == "no" %}
    <script>
    alert("Job Details Updated");
    window.location.href = ('{% url 'edit_jobdetail' job.id %}')
    </script>
    {% endif %}

    {% if error == "yes" %}
    <script>
    alert("Something went wrong, please try again");
    </script>
    {% endif %}



{% endblock %}
