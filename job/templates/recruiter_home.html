{%load static %}

{% block body %}
    {% include 'recruiter_navigation.html' %}

        <marquee style="font-family: 'Monotype Corsiva',serif ; font-size: 25px ; color: darkcyan ; background-color: black ; font-weight: bold ; margin-top: 1% ">
    Recruiter Home
    </marquee>
<hr>
<div class="container">
<div class="row">
    <div class="col-sm-8">


    <form class=" mt-5"  name="signup" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>First Name</label>
            <label>
                <input type="text" class="form-control" name="fname" value="{{ recruiter.user.first_name }}" required>
            </label>

        </div>
        <div class="form-group col-md-6">
            <label>Last Name</label>
            <label>
                <input type="text" class="form-control" name="lname" value="{{ recruiter.user.last_name }}" required>
            </label>
        </div>
    </div>
     <div class="form-row">
        <div class="form-group col-md-6">
            <label>Contact</label>
            <label>
                <input type="tel" class="form-control" name="contact" value="{{ recruiter.mobile }}">
            </label>
        </div>

         <div class="form-group col-md-12">
            <label>Email ID</label>
            <label>
                <input type="email" class="form-control" name="email" value="{{ recruiter.user.username }}" readonly required>
            </label>
        </div>


    </div>
        

    <input type="submit" value="submit" class="btn btn-primary" style="width: 200px">


    </form>
</div>
    
    <div class="col-sm-4">
        <img src="{{ recruiter.image.url }}" width="300px" height="300px" alt="">
    </div>
    
</div>
</div>
    <br>
    <br>
    <br>


{% include 'footer.html' %}

{% if error == "no" %}
    <script>
    alert("Signup successful");
    window.location.href = ('{% url 'recruiter_login' %}')
    </script>
    {% endif %}

    {% if error == "yes" %}
    <script>
    alert("Something went wrong, please try again");
    </script>
    {% endif %}



{% endblock %}
