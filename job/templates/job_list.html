{%load static %}

{% block body %}
    {% include 'recruiter_navigation.html' %}

    <style>
    tr{text-align: center}
    </style>

<marquee style="font-family: 'Monotype Corsiva',serif ; font-size: 25px ; color: darkcyan ; background-color: black ; font-weight: bold ; margin-top: 1% ">
    View All Jobs
    </marquee>
    <hr>
<div >
 <table class="table table-hover " id="example">
<thead>
<tr style="background-color: darkblue; color: white">
    <th>S.No.</th>
    <th>Company</th>
    <th>Job title</th>
    <th>Creation Date</th>

    <th>Action</th>
</tr>
</thead>

<tbody>

{%  for i in job %}

<tr style="background-color: aqua">
    <td>{{ forloop.counter }}</td>
    <td>{{ i.recruiter.company }}</td>
<td>{{ i.title }}</td>
<td>{{ i.creation_date }}</td>

<td>
    <a href="{% url 'edit_jobdetail' i.id %}" class="btn btn-success">Edit</a>
    | <a href="{% url 'change_status' i.id %}" class="btn btn-danger">Delete</a>

</td>
</tr>

{% endfor %}
</tbody>

</table>
</div>

{% endblock %}
